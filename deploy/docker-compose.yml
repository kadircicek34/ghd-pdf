services:
  ghdpdf-app:
    build:
      context: ..
      dockerfile: Dockerfile.ghd
    container_name: ghdpdf-app
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      - TZ=Europe/Istanbul
    mem_limit: 768m
    security_opt:
      - no-new-privileges:true
    volumes:
      - ghdpdf_pb_data:/app/pb_data
    networks:
      gakademi_default:
        aliases:
          - ghdpdf-app
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/api/health"]
      interval: 15s
      timeout: 4s
      retries: 5
      start_period: 20s

volumes:
  ghdpdf_pb_data:
    name: ghdpdf_pb_data

networks:
  gakademi_default:
    external: true
    name: gakademi_default
